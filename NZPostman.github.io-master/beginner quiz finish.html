<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Results</title>
    <link rel="stylesheet" href="beginner quiz finish style.css" />
</head>
<body>

    <!-- Results Container -->
    <div class="quiz-container">
        <h2>Quiz Results</h2>
        
        <div id="resultContent" class="question">
            <p id="scoreText">Calculating your score...</p>
            <p id="statusText" class="status-msg"></p>
        </div>

        <!-- Dynamic Action Buttons Container -->
        <div id="buttonContainer" style="margin-top: 25px;"></div>
    </div>

    <!-- Results Logic Script -->
   <script>
        const score = parseInt(localStorage.getItem('quizScore')) || 0;
        const total = parseInt(localStorage.getItem('totalQuestions')) || 3;
        
        const scoreText = document.getElementById('scoreText');
        const statusText = document.getElementById('statusText');
        const buttonContainer = document.getElementById('buttonContainer');

        scoreText.innerHTML = `You got <strong>${score}</strong> out of <strong>${total}</strong> correct.`;

        const passingScore = total; 

        if (score >= passingScore) {
            statusText.textContent = "Status: PASSED 🎉";
            statusText.style.color = "#28a745"; // Green
            
            // Added id="menuBtn" so we can target it below
            buttonContainer.innerHTML = `
                <a href="index.html" id="menuBtn" class="action-btn">Finish to Main Menu</a>
            `;
        } else {
            statusText.textContent = "Status: FAILED - Try Again ❌";
            statusText.style.color = "#dc3545"; // Red
            
            // Added id="restartBtn" so we can target it below
            buttonContainer.innerHTML = `
                <a href="beginner quiz Q1.html" id="restartBtn" class="action-btn">Restart Quiz</a>
            `;
        }

        // Reset the score to 0 whichever button gets clicked
        const menuBtn = document.getElementById('menuBtn');
        const restartBtn = document.getElementById('restartBtn');

        if (menuBtn) {
            menuBtn.addEventListener('click', () => {
                localStorage.setItem('quizScore', 0);
            });
        }

        if (restartBtn) {
            restartBtn.addEventListener('click', () => {
                localStorage.setItem('quizScore', 0);
            });
        }
    </script>

</body>
</html>
