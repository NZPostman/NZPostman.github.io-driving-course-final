<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autoplay Video</title>
    <link rel="stylesheet" href="beginner video style.css" />
</head>
<body>

    <!-- Back Button -->
    <a href="beginner.html" class="back-btn">&#8592; Back</a>

    <!-- Video Container -->
    <div class="video-container">
        <video id="lessonVideo" src="./Images/2026-10-10 14-29-05.mp4" autoplay playsinline controls width="100%">
            Your browser does not support the video tag.
        </video>
    </div>

    <!-- Next Button (Initially Hidden) -->
    <a href="beginner quiz.html" id="nextBtn" class="next-btn hidden">Next &#8594;</a>

    <!-- Unlock Script -->
    <script>
        const video = document.getElementById('lessonVideo');
        const nextBtn = document.getElementById('nextBtn');

        video.addEventListener('ended', () => {
            nextBtn.classList.remove('hidden');
        });
    </script>

</body>
</html>
